[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acrochoreo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "google-genai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]